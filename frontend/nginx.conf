server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver for variable-based proxy_pass
    resolver 127.0.0.11 valid=10s;

    # Proxy API requests to the Go backend
    # Uses a variable to defer DNS resolution so nginx starts even without the api service
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets with long cache
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other root assets
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|eot|ttf|otf|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: try exact file, then clean .html version, then index directory, then SPA root
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
