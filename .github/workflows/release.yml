name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-w -s -X github.com/notfixingit3/echostate/internal/version.Version=${VERSION}"
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o echostate-linux-amd64 ./main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o echostate-linux-arm64 ./main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o echostate-darwin-amd64 ./main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o echostate-darwin-arm64 ./main.go

      - name: Remove stale releases for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release list --repo "${GITHUB_REPOSITORY}" --json tagName,id,isDraft \
            | jq -c --arg tag "$tag" '.[] | select(.tagName == $tag)' \
            | while read -r release; do
                id=$(echo "$release" | jq -r '.id')
                echo "Deleting release id=${id} for ${tag}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
              done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            args+=(--prerelease)
          fi
          for attempt in 1 2 3; do
            if gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
              echostate-linux-amd64 \
              echostate-linux-arm64 \
              echostate-darwin-amd64 \
              echostate-darwin-arm64; then
              exit 0
            fi
            echo "Release create attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "Failed to create release after 3 attempts"
          exit 1