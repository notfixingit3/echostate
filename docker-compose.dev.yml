# Local development overlay — build api/frontend from source instead of pulling GHCR.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Reclaim local build cache and stale dev images: ./scripts/docker-clean.sh

services:
  api:
    image: echostate-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VERSION: ${ECHOSTATE_VERSION:-dev}

  frontend:
    image: echostate-frontend:local
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_APP_VERSION: ${ECHOSTATE_VERSION:-dev}